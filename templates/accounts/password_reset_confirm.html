{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

    <h2 class="mb-4 text-center">
        Create New Password
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success w-100">
            Change Password
        </button>

    </form>

</div>

{% endblock %}
